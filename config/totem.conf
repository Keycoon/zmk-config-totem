# Daily-driver stability settings. ZMK Studio is useful for editing, but it adds
# runtime RPC/BLE traffic that is not worth keeping enabled on an unstable board.
CONFIG_ZMK_STUDIO=n

# Avoid dropping scan events during short bursts. A dropped release
# event is experienced as a key being held down and auto-repeating on the host.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=12

# Make debounce explicit and a bit less optimistic for this handwired matrix.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=12
